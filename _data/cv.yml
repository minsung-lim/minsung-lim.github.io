profile: >-
  Senior software engineer with 15 years at Samsung Electronics, including
  more than six years in Samsung Account backend roles and three years as a
  Technical Leader. Experience spans Android accessibility, cloud web
  applications, data platforms, and cloud infrastructure. Since January 2026,
  works on fraud-detection services for Samsung Account.

experience:
  - role: Samsung Account Backend Security
    organization: Samsung Electronics · Big Data Center
    period: Jan 2026 – Present
    highlights:
      - Develop fraud-detection services for account access and sensitive account events.
      - Implement risk-based controls and monitoring for account abuse and false positives.
  - role: Samsung Account Backend Core
    organization: Samsung Electronics · Big Data Center
    period: Feb 2020 – Dec 2025
    highlights:
      - Developed authentication and authorization APIs for Samsung Account.
      - Served as a Technical Leader for three years, leading technical design, delivery, and service reliability.
  - role: Advertising Platform DSP & DMP
    organization: Samsung Electronics · MX
    period: May 2018 – Jan 2020
    highlights:
      - Collaborated with two DSP partners, AdGear and Moloco, to design and evaluate DSP infrastructure on AWS and Google Cloud.
      - Developed Spark-based data-warehouse ETL pipelines and machine-learning workflows for the DMP.
  - role: Bixby Ops.
    organization: Samsung Electronics · MX
    period: Jan 2018 – Apr 2018
    highlights:
      - Automated Bixby Ops. infrastructure provisioning with Terraform to support continuous delivery.
  - role: Samsung Cloud Portal Frontend
    organization: Samsung Electronics · MX
    period: Mar 2016 – Dec 2017
    highlights:
      - "Developed web applications for three Samsung Cloud services: Gallery, Drive, and Notes, using AngularJS and React."
  - role: Android Application Development
    organization: Samsung Electronics · MX
    period: Jan 2013 – Feb 2016
    highlights:
      - Delivered three Help releases (1.0–3.0), along with features for the Call and Settings applications.
      - Implemented accessibility features including Switch Access, Assistant Menu, and Interaction Control.
  - role: Software Configuration Management and CI/CD
    organization: Samsung Electronics · MX
    period: Jul 2011 – Dec 2012
    highlights:
      - Built Jenkins-based CI/CD pipelines and software configuration-management tooling for OTA-capable releases.
  - role: Software Engineer
    organization: United Merchant Services, Inc. · Internship · Hackensack, New Jersey
    period: Feb 2010 – Feb 2011
    highlights:
      - Developed a credit-card processing module in C#.
      - Developed features for a point-of-sale application.

