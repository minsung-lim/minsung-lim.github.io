{% assign cv = site.data.cv %}
{% if cv.selected_work.size > 0 %}
<section class="cv-section" id="work" aria-labelledby="work-title">
  <h2 id="work-title">Selected Work</h2>
  <div class="card-grid">
    {% for item in cv.selected_work %}
    <article class="feature-card">
      <p class="entry-meta">{{ item.source_label }} · {{ item.year }}</p>
      <h3>{{ item.title }}</h3>
      <p>{{ item.description }}</p>
      <a class="text-link" href="{{ item.source_url }}" target="_blank" rel="noopener noreferrer">
        Read article <span aria-hidden="true">↗</span>
      </a>
    </article>
    {% endfor %}
  </div>
</section>
{% endif %}
