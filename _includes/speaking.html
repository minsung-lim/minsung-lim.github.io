{% assign cv = site.data.cv %}
{% if cv.speaking.size > 0 %}
<section class="cv-section" id="speaking" aria-labelledby="speaking-title">
  <h2 id="speaking-title">Speaking</h2>
  <div class="compact-list">
    {% for item in cv.speaking reversed %}
    <article class="compact-entry">
      <p class="entry-meta">{{ item.event }} · {{ item.year }}</p>
      <h3>{{ item.title }}</h3>
      {% if item.links.size > 0 %}
      {% for link in item.links %}
      <a class="text-link"
         href="{{ link.url }}"
         target="_blank"
         rel="noopener noreferrer"
         aria-label="{{ link.label }} for {{ item.title }} at {{ item.event }} {{ item.year }}">
        {{ link.label }} <span aria-hidden="true">↗</span>
      </a>
      {% endfor %}
      {% endif %}
    </article>
    {% endfor %}
  </div>
</section>
{% endif %}
